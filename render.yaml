# Render Blueprint (optional). Set secret values in the Render dashboard, not in this file.
services:
  - type: web
    name: expense-tracker
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DEBUG
        value: "False"
      - key: MONGODB_DB_NAME
        value: expense_tracker
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: expense-tracker-db
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: MONGODB_URI
        sync: false

databases:
  - name: expense-tracker-db
    plan: free
    databaseName: expense_tracker_auth
    user: expense_tracker
